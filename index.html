<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PortFolio </title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧑‍💻</text></svg>">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <canvas id="snow"></canvas>

    <div class="container">
        <div class="card glass">
            <img src="quizzard-logo.png" alt="Quizzard Logo" class="logo">

            <h1 class="fade-title">About Me</h1>

            <div class="info">
                 <p>🔹 I am the Owner of the UBG site Singularity</p>
                <p>🔹 Full-Stack Developer (.NET & React)</p>
                <p>🔹 Fluent in HTML, JavaScript & CSS</p>
            </div>

         
<div class="button-menu">

    <button class="menu-btn" onclick="window.open('https://guns.lol/surgehub', '_blank')">
        📎 All My Links
    </button>

    <button class="menu-btn" onclick="window.open('https://surgehub.space', '_blank')">
        UBG ( unblocked games) Site
    </button>

    <button class="menu-btn" onclick="window.open('https://discord.gg/surgehub', '_blank')">
        🗨 Discord Server
    </button>

</div>

        </div>
    </div>

  
    <div class="bottom-player glass" id="player">

        <img src="quizzard-logo.png" alt="Album Art" class="player-art" id="track-art">

        <div class="player-main">
            <div class="player-info">
                <span class="now-playing-label">Now Playing:</span>
                <span class="track-title" id="track-title">Running Through My Head</span>
                <span class="track-artist" id="track-artist">by SURGE HUB</span>
            </div>

            <div class="progress-row">
                <span class="time-label" id="time-current">0:00</span>
                <div class="progress-bar" id="progress-bar">
                    <div class="progress-fill" id="progress-fill"></div>
                </div>
                <span class="time-label" id="time-total">0:00</span>
            </div>
        </div>

        <div class="player-controls">
            <button class="ctrl-btn" id="prev-btn" title="Restart">
                <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
            </button>

            <button class="ctrl-btn play-btn" id="play-btn" title="Play/Pause">
                <svg id="play-icon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                <svg id="pause-icon" viewBox="0 0 24 24" style="display:none"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>
            </button>

            <button class="ctrl-btn" id="next-btn" title="Restart">
                <svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2zM6 6l8.5 6L6 18z"/></svg>
            </button>

            <button class="ctrl-btn" id="repeat-btn" title="Loop">
                <svg viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2z"/></svg>
            </button>

            <button class="ctrl-btn" id="volume-btn" title="Mute/Unmute">
                <svg id="vol-icon" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4z"/></svg>
                <svg id="mute-icon" viewBox="0 0 24 24" style="display:none"><path d="M3 9v6h4l5 5V4L7 9H3zm13.59 3l2.7-2.71-1.41-1.41L15.17 12l-2.7-2.71-1.41 1.41L13.76 13l-2.7 2.71 1.41 1.41 2.7-2.71 2.7 2.71 1.41-1.41z"/></svg>
            </button>
        </div>

        <audio id="audio">
            <source src="song3.mp3" type="audio/mpeg">
        </audio>
    </div>

    <audio id="click-sound" src="842428__moulaythami__switch-038.wav" preload="auto"></audio>
    <audio id="hover-sound" src="611451__eminyildirim__ui-click-menu-hover.wav" preload="auto"></audio>

    <script src="script.js"></script>
</body>
</html>
